<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>[[TITLE]]</title>
<style>
@font-face{font-family:"MontserratV";src:url("[[ASSETS]]/fonts/Montserrat-VF.ttf");font-weight:100 900}
@font-face{font-family:"RobotoV";src:url("[[ASSETS]]/fonts/Roboto-Regular.ttf");font-weight:400}
@font-face{font-family:"RobotoV";src:url("[[ASSETS]]/fonts/Roboto-Medium.ttf");font-weight:500}
@font-face{font-family:"RobotoV";src:url("[[ASSETS]]/fonts/Roboto-Bold.ttf");font-weight:700}
:root{--primary:#00BBCE;--secondary:#7F4282;--bg:#F2F2F2;--heading:#21272B;--body:#282F33;--muted:#6B6D70;--success:#00B365;--warning:#C99700;--danger:#D9534F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:[[W]]px;height:[[H]]px;overflow:hidden;background:#F2F2F2}
body{font-family:"RobotoV",Arial,sans-serif;color:var(--body)}
.mont,h1,h2{font-family:"MontserratV",Arial,sans-serif}
.stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(900px 700px at 90% -10%,rgba(0,187,206,.12),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(127,66,130,.10),transparent 60%),#F2F2F2}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
*,*::before,*::after{animation-play-state:paused !important;animation-fill-mode:both !important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes upIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes leftIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.16)}}

/* ảnh */
.photo{inset:0;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}
.shade{inset:0;background:linear-gradient(180deg,rgba(20,28,32,.35) 0%,rgba(20,28,32,.05) 35%,rgba(20,28,32,.55) 62%,rgba(20,28,32,.92) 100%)}
.hlogo{background:#FFFFFF;border-radius:16px;padding:14px 24px;box-shadow:0 10px 28px rgba(0,0,0,.30)}
.hlogo img{height:50px;display:block}
.htitle{color:#fff;font-weight:800;line-height:1.14;border-left:10px solid var(--primary);padding-left:26px}
.ptag span{display:inline-block;background:var(--danger);color:#fff;font-family:"MontserratV";font-weight:800;padding:12px 28px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}

/* khung phần mềm */
.frame{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.22)}
.frame.full{border-radius:0;box-shadow:none}
/* ảnh bìa mở đầu (cảnh cover): màn phần mềm thật làm nền, lớp trắng đậm bên trái chứa logo + tiêu đề */
.cvbg{inset:0;overflow:hidden}.cvbg img{width:100%;height:100%;object-fit:cover;object-position:top left;transform:scale(1.04)}
.cvwash{inset:0;background:linear-gradient(90deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.93) 46%,rgba(255,255,255,.35) 72%,rgba(255,255,255,.05) 100%)}
.cvlogo{height:64px}
.cvk{font-family:"MontserratV";font-weight:700;color:var(--secondary);letter-spacing:3px;text-transform:uppercase}
.cvt{font-family:"MontserratV";font-weight:800;color:var(--heading);line-height:1.12;border-left:12px solid var(--primary);padding-left:30px}
.bbar{height:36px;background:#E9ECEF;display:flex;align-items:center;gap:8px;padding:0 16px}
.bbar i{width:12px;height:12px;border-radius:50%;background:#C9CDD2}
.bbar span{margin-left:12px;font-size:16px;color:var(--muted)}
.view{position:relative;overflow:hidden;background:#fff}
.cam{position:absolute;left:0;top:0}
.cam img{display:block}
.ring{position:absolute;border:4px solid var(--warning);border-radius:8px;box-shadow:0 0 0 6px rgba(201,151,0,.28)}
.cap span{display:inline-block;background:var(--secondary);color:#fff;font-family:"MontserratV";font-weight:700;border-radius:40px;box-shadow:0 12px 30px rgba(127,66,130,.35)}

.illus{position:absolute;left:16px;bottom:16px;background:rgba(33,39,43,.85);color:#fff;font-size:22px;padding:6px 16px;border-radius:10px;z-index:5}
.phone{background:#1E2326;border-radius:44px;box-shadow:0 30px 70px rgba(0,0,0,.30)}

/* trước - sau */
.ba .card{position:absolute;background:#fff;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.14);padding:34px 36px}
.ba .role{font-family:"MontserratV";font-weight:800;font-size:26px;letter-spacing:2px;text-transform:uppercase}
.ba .pain{border-top:10px solid var(--danger)}.ba .pain .role{color:var(--danger)}
.ba .hi{border-top:10px solid var(--success)}.ba .hi .role{color:var(--success)}
.ba .txt{font-family:"MontserratV";font-weight:800;color:var(--heading);margin-top:12px;line-height:1.2}
.ba .sub{color:var(--muted);margin-top:14px;line-height:1.4}
.ba .arr{position:absolute;color:var(--primary);font-weight:800;text-align:center}
.ba .bt{position:absolute;left:0;right:0;text-align:center;font-family:"MontserratV";font-weight:800;color:var(--heading)}

/* thẻ chuyển phần + nhãn góc */
.secbg{inset:0;overflow:hidden}.secbg img{width:100%;height:100%;object-fit:cover;object-position:top;filter:blur(14px);transform:scale(1.08)}
.secwash{inset:0;background:linear-gradient(135deg,rgba(255,255,255,.90),rgba(242,242,242,.82))}
.secbox{left:60px;right:60px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.seck{font-family:"MontserratV";font-weight:700;color:var(--secondary);letter-spacing:3px;text-transform:uppercase;margin-bottom:22px}
.sect{font-family:"MontserratV";font-weight:800;color:var(--heading);line-height:1.15;border-bottom:10px solid var(--primary);padding-bottom:18px}
.badge{z-index:20}.badge span{display:inline-block;background:var(--primary);color:#fff;font-family:"MontserratV";font-weight:800;letter-spacing:1px;padding:10px 22px;border-radius:30px;box-shadow:0 10px 26px rgba(0,187,206,.35)}

/* kết: nền trắng, logo màu chuẩn, nút cyan chữ trắng (màu lấy từ brand-tokens.json) */
.endbg{inset:0;background:#FFFFFF}
.elogo{left:0;right:0;text-align:center}
.etag{left:60px;right:60px;text-align:center;color:var(--heading);font-family:"MontserratV";font-weight:800;line-height:1.2}
.ectaw{left:0;right:0;text-align:center}
.ecta{display:inline-block;background:var(--primary);color:#FFFFFF;font-family:"MontserratV";font-weight:800;border-radius:60px;box-shadow:0 18px 44px rgba(0,187,206,.30)}
.eweb{left:0;right:0;text-align:center;color:var(--muted);font-family:"MontserratV";font-weight:700;letter-spacing:1px}

/* phụ đề */
#sub{position:absolute;left:0;right:0;z-index:50}
#sub span{position:absolute;bottom:0;left:0;right:0;margin:0 auto;width:fit-content;background:rgba(33,39,43,.86);color:#fff;text-align:center;border-radius:14px}
[[FMT_CSS]]
</style>
</head>
<body class="[[FMT]]">
<div class="stage">
<!--SCENES-->
<div id="sub">
<!--SUBS-->
</div>
</div>
<script>
const DURATION = [[END]];
const FADE = 0.35;
const scenes = [...document.querySelectorAll('.scene')];
// cam: data-cam "t,S,fx,fy;..." (S = độ phóng so với ảnh rộng bằng khung, fx/fy = điểm ảnh đặt giữa khung)
const cams = [...document.querySelectorAll('[data-cam]')].map(el => ({el, k: el.dataset.cam.split(';').map(r => r.split(',').map(Number))}));
const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
function sceneOpacity(s, t){
  const a = +s.dataset.in, b = +s.dataset.out;
  if (t < a || t > b) return 0;
  const fin = a === 0 ? 1 : Math.min(1, (t - a) / FADE);
  const fout = b === DURATION ? 1 : Math.min(1, (b - t) / FADE);
  return Math.max(0, Math.min(fin, fout));
}
window.renderAt = function(t){
  for (const s of scenes){ const o = sceneOpacity(s, t); s.style.opacity = o; s.style.visibility = o > 0 ? 'visible' : 'hidden'; }
  for (const el of document.querySelectorAll('[data-win]')){
    const [a,b] = el.dataset.win.split(',').map(Number);
    const o = Math.max(0, Math.min(1, (t-a)/0.3, (b-t)/0.3));
    el.style.opacity = o; el.style.visibility = o > 0 ? 'visible' : 'hidden';
  }
  for (const {el, k} of cams){
    let p = k[0];
    if (t >= k[k.length-1][0]) p = k[k.length-1];
    else for (let i = 0; i < k.length - 1; i++){
      if (t >= k[i][0] && t < k[i+1][0]){
        const u = ease((t - k[i][0]) / Math.max(0.001, k[i+1][0] - k[i][0]));
        p = k[i].map((v, j) => v + (k[i+1][j] - v) * u); break;
      }
    }
    const VW = el.parentElement.clientWidth, VH = el.parentElement.clientHeight, cw = el.clientWidth, ch = el.clientHeight, S = p[1];
    let tx = VW/2 - p[2]*cw*S, ty = VH/2 - p[3]*ch*S;
    tx = Math.min(0, Math.max(VW - cw*S, tx)); ty = Math.min(0, Math.max(VH - ch*S, ty));
    el.style.transformOrigin = '0 0';
    el.style.transform = `translate(${tx}px, ${ty}px) scale(${S})`;
  }
  for (const an of document.getAnimations()){ an.pause(); an.currentTime = t * 1000; }
  // đoạn quay thao tác thật: tua tới đúng thời điểm, chờ khung hình sẵn sàng (render.py chờ Promise này)
  const waits = [];
  for (const v of document.querySelectorAll('video[data-t0]')){
    // data-ts/data-rate2: sau khi lời đọc dứt (ts), đoạn quay chạy tiếp ở tốc độ rate2 (build.py SILENT_RATE)
    const r1 = +v.dataset.rate || 1, ts = v.dataset.ts ? +v.dataset.ts : Infinity, t0v = +v.dataset.t0;
    const pos = t <= ts ? (t - t0v) * r1 : Math.max(0, ts - t0v) * r1 + (t - ts) * (+v.dataset.rate2 || r1);
    const want = Math.max(0, Math.min((v.duration || 1e9) - 0.04, pos));
    if (Math.abs(v.currentTime - want) > 0.001){
      waits.push(new Promise(r => { v.addEventListener('seeked', r, {once: true}); v.currentTime = want; }));
    }
  }
  return Promise.all(waits);
};
window.videosReady = () => Promise.all([...document.querySelectorAll('video[data-t0]')].map(v =>
  v.readyState >= 2 ? 0 : new Promise(r => v.addEventListener('loadeddata', r, {once: true}))));
window.DURATION = DURATION;
renderAt(0);
</script>
</body>
</html>
